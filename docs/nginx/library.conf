# Plantilla para /etc/nginx/conf.d/library.conf, incluida dentro de http {}.
# Sustituir library.example.test por el nombre real, verificar el puerto 3000
# y confirmar API_PREFIX vacío en books/users/authors/pedidos/pagos.
server {
    listen 80;
    server_name library.example.test;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Diagnóstico solo desde la VM. No publica /metrics ni Swagger.
    location = /api/login/health {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass http://127.0.0.1:5000/health;
    }
    location = /api/books/health {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass http://127.0.0.1:5001/health;
    }
    location = /api/users/health {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass http://127.0.0.1:5002/health;
    }
    location = /api/authors/health {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass http://127.0.0.1:5003/health;
    }
    location = /api/pedidos/health {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass http://127.0.0.1:5004/health;
    }
    location = /api/pagos/health {
        allow 127.0.0.1; allow ::1; deny all;
        proxy_pass http://127.0.0.1:5005/health;
    }

    # Rutas especiales de login. /api/login es el POST /login.
    location = /api/login {
        proxy_pass http://127.0.0.1:5000/login;
    }
    location ~ ^/api/login/(validate-email|register|verify|refresh|logout|session)$ {
        rewrite ^/api/login/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5000;
    }

    # Complementos reales de Books, Users, Pedidos y Pagos.
    location ~ ^/api/books/(formats|categories|genres|authors|concepts|cloud-concepts)$ {
        rewrite ^/api/books/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:5001;
    }
    location = /api/books/soap/clasificacion {
        proxy_pass http://127.0.0.1:5001/soap/clasificacion;
    }
    location = /api/books/cache/invalidate {
        proxy_pass http://127.0.0.1:5001/cache/invalidate;
    }
    location ~ ^/api/users/roles(?:/.*)?$ {
        rewrite ^/api/users(/roles.*)$ $1 break;
        proxy_pass http://127.0.0.1:5002;
    }
    location ~ ^/api/pedidos/envios/.*$ {
        rewrite ^/api/pedidos(/envios/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5004;
    }
    location = /api/pagos/metodos {
        proxy_pass http://127.0.0.1:5005/metodos;
    }
    # Debe preceder a la regla general de Pagos.
    location ~ ^/api/pagos/pedidos/[0-9]+/saldo$ {
        rewrite ^/api/pagos(/pedidos/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5005;
    }
    location ~ ^/api/books(?:/.*)?$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5001;
    }
    location ~ ^/api/users(?:/.*)?$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5002;
    }
    location ~ ^/api/authors(?:/.*)?$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5003;
    }
    location ~ ^/api/pedidos(?:/.*)?$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5004;
    }
    location ~ ^/api/pagos(?:/.*)?$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5005;
    }

    # Una ruta API desconocida no debe caer en el monolito.
    location = /api { return 404; }
    location /api/ { return 404; }

    # Confirmar el puerto en la VM antes de instalar.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
